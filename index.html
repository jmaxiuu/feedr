<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feedr — dinner's on, video's picked</title>
<meta name="description" content="One tap picks what you watch while you eat. No scrolling, no menu paralysis.">

<meta name="theme-color" content="#120d09">
<meta name="color-scheme" content="dark">

<!-- installable on iOS home screen -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Feedr">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">

<link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/courier-prime-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <header>
    <div class="logo">Feedr<em>.</em></div>
    <div class="tag">no scroll · just eat</div>
  </header>

  <div class="controls" id="controls">
    <div class="label">How long is this meal?</div>
    <div class="chips" id="lenChips"></div>
    <div class="label">What flavor tonight?</div>
    <div class="chips" id="moodChips"></div>
  </div>

  <div class="stage">
    <div id="idle" style="text-align:center">
      <button class="feed-btn" id="feedBtn">Feed me<span>tap once · eat</span></button>
      <div class="hint">One tap. Zero scrolling.</div>
    </div>

    <div class="cooking" id="cooking">
      <div class="dots">● ● ●</div>
      <p>Plating your pick…</p>
    </div>

    <div class="ticket-wrap" id="ticketWrap">
      <div class="ticket" id="ticket">
        <div class="t-head"><span id="orderNo">Order #0001</span><span id="orderTime"></span></div>
        <div class="t-rule"></div>
        <div class="t-eyebrow">Tonight's pick</div>
        <div class="t-title" id="tTitle"></div>
        <div class="t-meta" id="tMeta"></div>
        <div class="t-fit" id="tFit"></div>
      </div>
      <div class="chooser" id="chooser">
        <div class="chooser-head">Kitchen's closed — pick one 🍽</div>
      </div>
      <div class="t-actions" id="tActions">
        <button class="btn btn-yt" id="openBtn">▶ &nbsp;Open in YouTube</button>
        <div class="btn-row">
          <button class="btn btn-ghost" id="rerollBtn">↻ Not this</button>
          <button class="btn btn-ghost" id="backBtn">← Change meal</button>
        </div>
      </div>
    </div>

    <div class="fault" id="fault">
      <div class="dots">✕</div>
      <p id="faultMsg">Kitchen's shut.</p>
      <button class="btn btn-ghost" id="retryBtn">↻ Try again</button>
    </div>
  </div>

  <footer>Feedr picks · YouTube plays</footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
